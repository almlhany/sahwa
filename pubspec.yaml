name: islamic_app
description: تطبيق القرآن الكريم والأذكار بدون إنترنت
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0     # لتشغيل الصوتيات محلياً بدون إنترنت
  shared_preferences: ^2.2.0 # لحفظ عداد التسبيح والسور المحفوظة

flutter:
  uses-material-design: true
  assets:
    - assets/audio/        # مجلد الملفات الصوتية (مثل سورة الفاتحة mp3)